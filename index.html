<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="승자예측">
<link rel="manifest" href="./manifest.webmanifest">
<title>스타 승자예측</title>
<style>
:root{--bg:#0a0f1e;--panel:#141b2d;--panel2:#1b2540;--line:#2a3657;--text:#f6f8ff;--muted:#9da9c4;--accent:#7788ff;--good:#30d07b;--bad:#ff6577;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}
.wrap{max-width:1280px;margin:auto;padding:16px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{font-size:24px;margin:0 auto 0 0}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);border-color:transparent}.good{background:#174d35}.danger{background:#542332}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.card h2{font-size:16px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.teamboard{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:8px 0 12px}.team{background:var(--panel2);border-radius:14px;padding:14px;text-align:center}.teamname{font-size:18px;font-weight:900}.score{font-size:30px;font-weight:1000;margin-top:4px}.sep{font-size:22px;color:var(--muted);font-weight:900}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 0}.player{background:var(--panel2);padding:16px 10px;border-radius:14px;text-align:center;font-size:22px;font-weight:900}.teamtag{display:block;font-size:11px;color:var(--muted);margin-top:4px}.vs{color:var(--muted);font-weight:900}
.status{font-size:13px;color:var(--muted);margin:8px 0 12px}.status b{color:var(--gold)}.pred-list{display:grid;gap:8px}.pred{display:grid;grid-template-columns:150px 1fr 1fr;gap:8px;align-items:center;background:#10172a;padding:8px;border-radius:12px}.name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pick{min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;font-weight:800}.pick.on{outline:2px solid var(--accent);background:#29356c}.pick.correct{outline:2px solid var(--good)}.pick.wrong{outline:2px solid var(--bad)}
.resultbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}th{font-size:12px;color:var(--muted)}td:nth-child(2){text-align:left;font-weight:900}.hist{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}.hist.current{background:#1d2743;border-radius:8px;padding-left:8px}.small{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.dialog{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}.dialog h3{margin:0 0 12px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}.field textarea{min-height:210px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:900px){.layout{grid-template-columns:1fr}.pred{grid-template-columns:105px 1fr 1fr}.player{font-size:18px}}@media(max-width:520px){.grid2{grid-template-columns:1fr}.pred{grid-template-columns:88px 1fr 1fr}.player{font-size:17px}}
</style>
</head><body>
<div class="wrap">
<header><h1>🎮 스타 승자예측</h1>
<button class="btn" onclick="openParticipants()">참가자</button>
<button class="btn" onclick="openEventSettings()">대회/팀 설정</button>
<button class="btn" onclick="openRoster()">선수 명단</button>
<button class="btn" onclick="exportData()">백업</button>
<label class="btn">복원<input id="restoreFile" type="file" accept="application/json" hidden onchange="restoreData(event)"></label>
<button class="btn danger" onclick="resetTournament()">대회 초기화</button></header>

<div class="layout"><section class="card">
<h2 id="tourTitle"></h2>
<div class="teamboard" id="teamBoard" style="display:none"><div class="team"><div class="teamname" id="teamAName"></div><div class="score" id="teamAScore">0</div></div><div class="sep">:</div><div class="team"><div class="teamname" id="teamBName"></div><div class="score" id="teamBScore">0</div></div></div>
<div class="toolbar"><button class="btn primary" onclick="openNewMatch()">＋ 새 경기</button><button class="btn" onclick="duplicateMatch()">이전 대진 복사</button><button class="btn" id="lockBtn" onclick="toggleLock()">🔒 예측 마감</button></div>
<div class="match"><div class="player" id="p1">선수 A</div><div class="vs">VS</div><div class="player" id="p2">선수 B</div></div>
<div class="status" id="status"></div><div class="pred-list" id="predList"></div>
<div class="resultbar"><button class="btn good" id="win1" onclick="setWinner(1)">선수 A 승</button><button class="btn good" id="win2" onclick="setWinner(2)">선수 B 승</button><button class="btn" onclick="clearWinner()">결과 취소</button><button class="btn danger" onclick="deleteCurrentMatch()">경기 삭제</button></div>
</section>
<aside><section class="card"><h2>🏆 현재 순위</h2><table><thead><tr><th>순위</th><th>참가자</th><th>적중</th><th>오답</th><th>적중률</th></tr></thead><tbody id="rankBody"></tbody></table></section><section class="card" style="margin-top:14px"><h2>📋 경기 기록</h2><div id="history"></div></section></aside>
</div></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
const KEY='starPredictionManager_v3';
function blank(){return {tournament:'새 대회',teamA:'',teamB:'',participants:[],roster:[],matches:[],current:-1,version:3}}
let data=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function current(){return data.matches[data.current]||null}
function teamLabel(c){return c==='A'?data.teamA:c==='B'?data.teamB:''}
function teamScore(){let a=0,b=0;data.matches.forEach(m=>{if(!m.winner)return;let t=m.winner===1?m.team1:m.team2;if(t==='A')a++;if(t==='B')b++});return{a,b}}
function render(){
 let m=current(),tm=!!(data.teamA||data.teamB),s=teamScore();
 document.getElementById('tourTitle').textContent='🏟️ '+data.tournament;
 document.getElementById('teamBoard').style.display=tm?'grid':'none';
 document.getElementById('teamAName').textContent=data.teamA||'팀 A';document.getElementById('teamBName').textContent=data.teamB||'팀 B';document.getElementById('teamAScore').textContent=s.a;document.getElementById('teamBScore').textContent=s.b;
 document.getElementById('p1').innerHTML=m?esc(m.p1)+(m.team1?'<span class="teamtag">'+esc(teamLabel(m.team1))+'</span>':''):'선수 A';
 document.getElementById('p2').innerHTML=m?esc(m.p2)+(m.team2?'<span class="teamtag">'+esc(teamLabel(m.team2))+'</span>':''):'선수 B';
 document.getElementById('win1').textContent=(m?m.p1:'선수 A')+' 승';document.getElementById('win2').textContent=(m?m.p2:'선수 B')+' 승';
 document.getElementById('lockBtn').textContent=m&&m.locked?'🔓 예측 다시 열기':'🔒 예측 마감';
 document.getElementById('status').innerHTML=m?`${data.current+1}경기 · 예측 ${Object.keys(m.picks||{}).length}/${data.participants.length}명 · <b>${m.locked?'마감':'진행중'}</b>${m.winner?` · 결과 <b>${esc(m.winner===1?m.p1:m.p2)} 승</b>`:''}`:'새 경기를 등록해줘.';
 let pl=document.getElementById('predList');pl.innerHTML='';
 data.participants.forEach(n=>{let p=m?.picks?.[n],d=document.createElement('div');d.className='pred';d.innerHTML=`<div class="name">${esc(n)}</div><button class="pick ${p===1?'on':''}" ${!m||m.locked||m.winner?'disabled':''} onclick="pick('${encodeURIComponent(n)}',1)">${esc(m?.p1||'A')}</button><button class="pick ${p===2?'on':''}" ${!m||m.locked||m.winner?'disabled':''} onclick="pick('${encodeURIComponent(n)}',2)">${esc(m?.p2||'B')}</button>`;pl.appendChild(d)});
 renderRanks();renderHistory()
}
function stats(n){let h=0,m=0;data.matches.forEach(x=>{if(x.winner&&x.picks?.[n])x.picks[n]===x.winner?h++:m++});return{h,m,t:h+m,r:h+m?h/(h+m):0}}
function renderRanks(){let a=data.participants.map(n=>({n,...stats(n)})).sort((x,y)=>y.h-x.h||y.r-x.r||x.n.localeCompare(y.n,'ko'));document.getElementById('rankBody').innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.h}</td><td>${x.m}</td><td>${x.t?(x.r*100).toFixed(1):'0'}%</td></tr>`).join('')}
function renderHistory(){document.getElementById('history').innerHTML=[...data.matches].reverse().map((m,ri)=>{let i=data.matches.length-ri-1,w=m.winner?(m.winner===1?m.p1:m.p2)+' 승':'결과 대기';return`<div class="hist ${i===data.current?'current':''}" onclick="data.current=${i};save()"><b>${i+1}경기 ${esc(m.p1)} vs ${esc(m.p2)}</b><div class="small">${esc(teamLabel(m.team1)||'-')} / ${esc(teamLabel(m.team2)||'-')} · ${esc(w)}</div></div>`}).join('')||'<div class="small">아직 경기 기록이 없어.</div>'}
function pick(n,v){let m=current();if(!m||m.locked||m.winner)return;m.picks[decodeURIComponent(n)]=v;save()}
function toggleLock(){let m=current();if(m){m.locked=!m.locked;save()}}
function setWinner(v){let m=current();if(!m)return;if(!m.locked&&!confirm('예측을 마감하고 결과 입력할까?'))return;m.locked=true;m.winner=v;save()}
function clearWinner(){let m=current();if(m){m.winner=null;save()}}
function duplicateMatch(){let m=current();if(!m)return;data.matches.push({p1:m.p1,p2:m.p2,team1:m.team1||'',team2:m.team2||'',picks:{},locked:false,winner:null});data.current=data.matches.length-1;save()}
function deleteCurrentMatch(){if(data.current<0||!confirm('현재 경기를 삭제할까?'))return;data.matches.splice(data.current,1);data.current=Math.min(data.current,data.matches.length-1);save()}
function resetTournament(){if(!confirm('경기/예측/순위를 초기화할까? 참가자와 선수 명단은 유지돼.'))return;data.matches=[];data.current=-1;save()}
function modal(h){document.getElementById('dialog').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function openParticipants(){modal(`<h3>참가자 관리</h3><div class="field"><textarea id="plist">${esc(data.participants.join('\n'))}</textarea></div><div class="toolbar"><button class="btn primary" onclick="saveParticipants()">저장</button><button class="btn" onclick="closeModal()">취소</button></div>`)}
function saveParticipants(){data.participants=[...new Set(document.getElementById('plist').value.split(/\n/).map(x=>x.trim()).filter(Boolean))];closeModal();save()}
function openEventSettings(){modal(`<h3>대회 / 팀 설정</h3><div class="field"><label>대회명</label><input id="tname" value="${esc(data.tournament)}"></div><div class="grid2"><div class="field"><label>팀 A</label><input id="ta" value="${esc(data.teamA)}"></div><div class="field"><label>팀 B</label><input id="tb" value="${esc(data.teamB)}"></div></div><div class="hint">팀명을 비우면 개인전처럼 사용 가능해.</div><div class="toolbar"><button class="btn primary" onclick="saveEventSettings()">저장</button><button class="btn" onclick="closeModal()">취소</button></div>`)}
function saveEventSettings(){data.tournament=document.getElementById('tname').value.trim()||'새 대회';data.teamA=document.getElementById('ta').value.trim();data.teamB=document.getElementById('tb').value.trim();closeModal();save()}
function openRoster(){modal(`<h3>선수 명단</h3><div class="field"><label>선수명|팀코드(A/B)</label><textarea id="rlist">${esc(data.roster.map(x=>x.name+'|'+(x.team||'')).join('\n'))}</textarea></div><div class="hint">예: 키링|A / 상대선수|B / 김택용|</div><div class="toolbar"><button class="btn primary" onclick="saveRoster()">저장</button><button class="btn" onclick="closeModal()">취소</button></div>`)}
function saveRoster(){let out=[],seen=new Set();document.getElementById('rlist').value.split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{let [name,team='']=line.split('|').map(x=>x.trim());team=team.toUpperCase();if(!['A','B'].includes(team))team='';if(name&&!seen.has(name)){seen.add(name);out.push({name,team})}});data.roster=out;closeModal();save()}
function rosterOpts(t){return `<option value="">직접 입력</option>`+data.roster.filter(x=>!t||x.team===t).map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}
function openNewMatch(){modal(`<h3>새 경기</h3><div class="grid2"><div class="field"><label>A측 팀</label><select id="nt1" onchange="refreshR()"><option value="">없음/개인전</option><option value="A">${esc(data.teamA||'팀 A')}</option><option value="B">${esc(data.teamB||'팀 B')}</option></select></div><div class="field"><label>B측 팀</label><select id="nt2" onchange="refreshR()"><option value="">없음/개인전</option><option value="A">${esc(data.teamA||'팀 A')}</option><option value="B">${esc(data.teamB||'팀 B')}</option></select></div></div><div class="grid2"><div class="field"><label>선수 A</label><select id="rp1" onchange="np1.value=this.value">${rosterOpts('')}</select><input id="np1" placeholder="선수명"></div><div class="field"><label>선수 B</label><select id="rp2" onchange="np2.value=this.value">${rosterOpts('')}</select><input id="np2" placeholder="선수명"></div></div><div class="toolbar"><button class="btn primary" onclick="addMatch()">경기 시작</button><button class="btn" onclick="closeModal()">취소</button></div>`)}
function refreshR(){let t1=document.getElementById('nt1').value,t2=document.getElementById('nt2').value;document.getElementById('rp1').innerHTML=rosterOpts(t1);document.getElementById('rp2').innerHTML=rosterOpts(t2);np1.value='';np2.value=''}
function addMatch(){let a=np1.value.trim(),b=np2.value.trim();if(!a||!b)return alert('두 선수 이름을 입력해줘.');data.matches.push({p1:a,p2:b,team1:nt1.value,team2:nt2.value,picks:{},locked:false,winner:null});data.current=data.matches.length-1;closeModal();save()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='승자예측_'+data.tournament+'.json';a.click()}
function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.participants)||!Array.isArray(x.matches))throw 0;data=x;save()}catch(_){alert('올바른 백업 파일이 아니야.')}};r.readAsText(f)}
render()
</script></body></html>
