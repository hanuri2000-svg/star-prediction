.status{font-size:13px;color:var(--muted);margin:8px 0 12px}.status b{color:var(--gold)}.pred-list{display:grid;gap:8px}.pred{display:grid;grid-template-columns:150px 1fr 1fr;gap:8px;align-items:center;background:#10172a;padding:8px;border-radius:12px}.name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pick{min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;font-weight:800}.pick.on{outline:2px solid var(--accent);background:#29356c}
.resultbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}th{font-size:12px;color:var(--muted)}td:nth-child(2){text-align:left;font-weight:900}.hist{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}.hist.current{background:#1d2743;border-radius:8px;padding-left:8px}.small{font-size:12px;color:var(--muted)}

/* ===== 맞혀도랑 v5.0 visual renovation ===== */
:root{
 --bg:#f8f6fb;--panel:#ffffff;--panel2:#f6f1fa;--line:#e8dfef;
 --text:#342d40;--muted:#95899f;--accent:#8c70c7;--accent2:#cf8fb4;
 --good:#68b89a;--bad:#d98596;--gold:#bf9452;
 --shadow:0 10px 32px rgba(75,52,103,.075);
}
body{
 background:
 radial-gradient(circle at 8% 0%,rgba(193,164,224,.20),transparent 26%),
 radial-gradient(circle at 92% 4%,rgba(231,174,207,.17),transparent 25%),
 var(--bg);
}
.wrap{max-width:1380px;padding:18px 22px 28px}
header{
 position:sticky;top:0;z-index:12;padding:12px 0 14px;
 background:rgba(248,246,251,.90);backdrop-filter:blur(15px);
}
.brand{margin-right:auto;min-width:230px}
.brand h1{margin:0;font-size:28px;letter-spacing:-.7px;font-weight:950}
.brand-icon{filter:saturate(.85)}
.version{font-size:10px;color:var(--muted);font-weight:800;vertical-align:middle}
.subtitle{font-size:12px;color:var(--muted);margin:3px 0 0 39px}
.btn{
 background:#fff;border-color:var(--line);color:var(--text);
 border-radius:12px;padding:10px 13px;box-shadow:0 2px 8px rgba(60,42,82,.025);
 transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 17px rgba(70,45,100,.08);border-color:#d6c8e2}
.primary{background:linear-gradient(135deg,#8b70c8,#c889b0);color:#fff;border-color:transparent}
.good{background:#edf8f3;color:#347c64;border-color:#cde8dc}
.danger{background:#fbf0f2;color:#a95567;border-color:#f0d2d9}
.layout{grid-template-columns:minmax(680px,1.55fr) minmax(390px,.72fr);gap:18px;align-items:start}
.card{border-color:var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.card h2{font-size:15px;color:#4b4057}
aside{position:sticky;top:94px;display:grid;gap:16px;max-height:calc(100vh - 112px)}
aside .card{margin-top:0!important}
aside .card:last-child{overflow:auto;max-height:49vh}
.team{background:linear-gradient(180deg,#fdfbfe,#f7f1fb);border:1px solid #eadff1}
.teamname{color:#574b63}.score{color:var(--accent)}
.player{
 background:linear-gradient(180deg,#fff,#f8f3fb);border:1px solid #e9dff0;
 box-shadow:0 6px 18px rgba(74,49,98,.04);font-size:27px;padding:19px 12px
}
.pred{background:#fcfafd;border:1px solid #eee7f3;grid-template-columns:175px 1fr 1fr;padding:9px}
.pick{background:#fff;border-color:#e7deee}
.pick.on{outline:none;border-color:transparent;background:linear-gradient(135deg,#8b70c8,#ca8bb1);color:#fff;box-shadow:0 5px 14px rgba(135,100,178,.16)}
.status{background:#fbf8fd;border:1px solid #eee7f3;border-radius:12px;padding:10px 12px}
.hist{border:1px solid transparent;border-radius:11px;margin-bottom:5px;padding:10px 8px}
.hist:hover{background:#faf6fc;border-color:#eee5f3}
.hist.current{background:#f2ebf8;border-color:#e4d7ed}
table tbody tr:hover{background:#fbf8fd}
.schedule-row{background:#fcfafd;border-color:#eee6f3}
.schedule-row input,.field input,.field textarea,.field select{background:#fff;border-color:#e5dbea}
.dialog{border-radius:20px;border-color:#e5dbea;box-shadow:0 20px 60px rgba(35,20,50,.18)}
.credit{text-align:center;color:#aaa0b2;font-size:11px;padding:4px 0 24px;letter-spacing:.15px}
.credit b{color:#897b94;font-weight:850}
.view-toggle{white-space:nowrap}

.save-state{

 body:not(.force-desktop) .prediction-summary{grid-template-columns:1fr 90px 1fr;gap:6px}

 body:not(.force-desktop) .vote-card b,body:not(.force-desktop) .missing-card b{font-size:16px}

<body>
<div class="wrap">
<header>
<div class="brand"><h1><span class="brand-icon">🔮</span> 맞혀도랑 <span class="version">v5.2</span></h1><div class="subtitle">오늘의 스타 승부, 누가 제일 잘 맞힐까?</div></div>
<button class="btn" onclick="openParticipants()">참가자</button>
<button class="btn" onclick="quickAddParticipant()">＋ 빠른 참가자</button>
<button class="btn" onclick="openEventSettings()">대회/팀 설정</button>
<button class="btn" onclick="openSchedule()">대진표 관리</button>
<button class="btn view-toggle" id="viewToggle" onclick="toggleDesktopMode()">🖥 PC 화면</button>
<button class="btn" onclick="exportData()">백업</button>
<button class="btn" onclick="checkForUpdate(true)">업데이트 확인</button>
<label class="btn">복원<input id="restoreFile" type="file" accept="application/json" hidden onchange="restoreData(event)"></label>
<span id="saveState" class="save-state">✓ 자동 저장됨</span>
<button class="btn danger" onclick="resetTournament()">대회 초기화</button>
</header>

<div class="layout">
<section class="card">
<h2 id="tourTitle"></h2>
<div class="teamboard" id="teamBoard" style="display:none">
<div class="team"><div class="teamname" id="teamAName"></div><div class="score" id="teamAScore">0</div></div>
<div class="sep">:</div>
<div class="team"><div class="teamname" id="teamBName"></div><div class="score" id="teamBScore">0</div></div>
</div>

<div class="toolbar">
<button class="btn primary" onclick="openNewMatch()">＋ 경기 추가</button>
<button class="btn" onclick="prevMatch()">◀ 이전 경기</button>
<button class="btn" onclick="nextMatch()">다음 경기 ▶</button>
<button class="btn" onclick="duplicateMatch()">이전 대진 복사</button>
<button class="btn" id="lockBtn" onclick="toggleLock()">🔒 예측 마감</button>
</div>

<div class="match">
<div class="player" id="p1">선수 A</div><div class="vs">VS</div><div class="player" id="p2">선수 B</div>
</div>
<div class="prediction-summary" id="predictionSummary">
      <div class="vote-card left"><b id="voteP1">0명 · 0%</b><span id="voteP1Name">선수 A</span></div>
      <button class="missing-card" id="missingBtn" onclick="toggleMissingOnly()"><b id="missingCount">0명</b><span>미예측</span></button>
      <div class="vote-card right"><b id="voteP2">0명 · 0%</b><span id="voteP2Name">선수 B</span></div>
    </div>
    <div class="status" id="status"></div>
<div class="pred-list" id="predList"></div>

<div class="resultbar">
<button class="btn good" id="win1" onclick="setWinner(1)">선수 A 승</button>
<button class="btn good" id="win2" onclick="setWinner(2)">선수 B 승</button>
<button class="btn" onclick="clearWinner()">결과 취소</button>
<button class="btn danger" onclick="deleteCurrentMatch()">경기 삭제</button>
</div>
<div id="postResultBar" class="post-result-bar" style="display:none">
  <div class="post-result-text" id="postResultText"></div>
  <button class="btn primary" onclick="nextMatch()">다음 경기 ▶</button>
</div>
</section>

<aside>
<section class="card"><h2>🏆 현재 순위</h2>
<table><thead><tr><th>순위</th><th>참가자</th><th>등락</th><th>적중</th><th>오답</th><th>적중률</th></tr></thead><tbody id="rankBody"></tbody></table>
</section>
<section class="card" style="margin-top:14px"><h2>📋 전체 대진</h2><div id="history"></div></section>
</aside>
</div>
</div>
<footer class="credit">Made by <b>라비c</b></footer>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>

<script>
const KEY='starPredictionManager_v31';
function blank(){return {tournament:'새 대회',teamA:'',teamB:'',participants:[],matches:[],current:-1,version:31}}
let data=load();
let missingOnly=false;
let previousRanks={};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}}
function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  const s=document.getElementById('saveState');
  if(s){s.textContent='저장 중…';s.style.opacity='.65'}
  render();
  setTimeout(()=>{const x=document.getElementById('saveState');if(x){x.textContent='✓ 자동 저장됨';x.style.opacity='1'}},220);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function current(){return data.matches[data.current]||null}
function teamLabel(c){return c==='A'?data.teamA:c==='B'?data.teamB:''}
function teamScore(){let a=0,b=0;data.matches.forEach(m=>{if(!m.winner)return;let t=m.winner===1?m.team1:m.team2;if(t==='A')a++;if(t==='B')b++});return{a,b}}


function raceLabel(r){
  return r==='P'?'프로토스':r==='T'?'테란':r==='Z'?'저그':r==='R'?'랜덤':'';
}
function raceShort(r){ return r||''; }
function raceBadge(r){
  if(!r) return '';
  const cls=r==='P'?'race-p':r==='T'?'race-t':r==='Z'?'race-z':'race-r';
  return `<span class="race-badge ${cls}" title="${raceLabel(r)}">${raceShort(r)}</span>`;
}
function raceOptions(selected=''){
  const opts=[['','미지정'],['P','프로토스 (P)'],['T','테란 (T)'],['Z','저그 (Z)'],['R','랜덤 (R)']];
  return opts.map(([v,n])=>`<option value="${v}" ${selected===v?'selected':''}>${n}</option>`).join('');
}

function render(){
 const m=current(), tm=!!(data.teamA||data.teamB), s=teamScore();
 document.getElementById('tourTitle').textContent='🏟️ '+data.tournament;
 document.getElementById('teamBoard').style.display=tm?'grid':'none';
 document.getElementById('teamAName').textContent=data.teamA||'팀 A';
 document.getElementById('teamBName').textContent=data.teamB||'팀 B';
 document.getElementById('teamAScore').textContent=s.a; document.getElementById('teamBScore').textContent=s.b;
 document.getElementById('p1').innerHTML=m?`${esc(m.p1)} ${raceBadge(m.race1||'')}${m.team1?'<span class="teamtag">'+esc(teamLabel(m.team1))+'</span>':''}`:'선수 A';
 document.getElementById('p2').innerHTML=m?`${esc(m.p2)} ${raceBadge(m.race2||'')}${m.team2?'<span class="teamtag">'+esc(teamLabel(m.team2))+'</span>':''}`:'선수 B';
 document.getElementById('win1').textContent=(m?m.p1:'선수 A')+' 승';
 document.getElementById('win2').textContent=(m?m.p2:'선수 B')+' 승';
 document.getElementById('lockBtn').textContent=m&&m.locked?'🔓 예측 다시 열기':'🔒 예측 마감';
 
 const picks=m?.picks||{};
 let c1=0,c2=0;
 data.participants.forEach(n=>{if(picks[n]===1)c1++;else if(picks[n]===2)c2++;});
 const voted=c1+c2;
 const p1pct=voted?Math.round(c1/voted*100):0;
 const p2pct=voted?Math.round(c2/voted*100):0;
 document.getElementById('voteP1').textContent=`${c1}명 · ${p1pct}%`;
 document.getElementById('voteP2').textContent=`${c2}명 · ${p2pct}%`;
 document.getElementById('voteP1Name').textContent=m?m.p1:'선수 A';
 document.getElementById('voteP2Name').textContent=m?m.p2:'선수 B';
 const miss=Math.max(0,data.participants.length-voted);
 document.getElementById('missingCount').textContent=`${miss}명`;
 document.getElementById('missingBtn').classList.toggle('active',missingOnly);
 const prb=document.getElementById('postResultBar');
 if(prb){
   prb.style.display=m&&m.winner?'flex':'none';
   const txt=document.getElementById('postResultText');
   if(txt&&m?.winner) txt.textContent=`${m.winner===1?m.p1:m.p2} 승 · 순위 갱신 완료`;
 }

 document.getElementById('status').innerHTML=m?`${data.current+1}경기 · 예측 ${Object.keys(m.picks||{}).length}/${data.participants.length}명 · <b>${m.locked?'마감':'진행중'}</b>${m.winner?` · 결과 <b>${esc(m.winner===1?m.p1:m.p2)} 승</b>`:''}`:'새 경기를 등록해줘.';
 const pl=document.getElementById('predList');pl.innerHTML='';
 data.participants.forEach(n=>{
   let p=m?.picks?.[n],d=document.createElement('div');d.className='pred'; if(missingOnly && p) d.classList.add('hidden-by-filter');
   d.innerHTML=`<div class="name">${esc(n)}</div>
   <button class="pick ${p===1?'on':''}" ${!m||m.locked||m.winner?'disabled':''} onclick="pick('${encodeURIComponent(n)}',1)">${esc(m?.p1||'A')}</button>
   <button class="pick ${p===2?'on':''}" ${!m||m.locked||m.winner?'disabled':''} onclick="pick('${encodeURIComponent(n)}',2)">${esc(m?.p2||'B')}</button>`;
   pl.appendChild(d)
 });
 renderRanks();renderHistory()
}
function stats(n){let h=0,m=0;data.matches.forEach(x=>{if(x.winner&&x.picks?.[n])x.picks[n]===x.winner?h++:m++});return{h,m,t:h+m,r:h+m?h/(h+m):0}}
function renderRanks(){
 let arr=data.participants.map(n=>({n,...stats(n)}))
   .sort((a,b)=>b.h-a.h||b.r-a.r||a.n.localeCompare(b.n,'ko'));
 const newRanks={};
 arr.forEach((x,i)=>newRanks[x.n]=i+1);
 document.getElementById('rankBody').innerHTML=arr.map((x,i)=>{
   const rank=i+1;
   const prev=previousRanks[x.n];
   let change='<span class="rank-change rank-same">―</span>';
   if(prev && prev>rank) change=`<span class="rank-change rank-up">▲${prev-rank}</span>`;
   else if(prev && prev<rank) change=`<span class="rank-change rank-down">▼${rank-prev}</span>`;
   return `<tr><td>${rank}</td><td>${esc(x.n)}</td><td>${change}</td><td>${x.h}</td><td>${x.m}</td><td>${x.t?(x.r*100).toFixed(1):'0'}%</td></tr>`;
 }).join('');
 previousRanks=newRanks;
}
function renderHistory(){document.getElementById('history').innerHTML=[...data.matches].reverse().map((m,ri)=>{let i=data.matches.length-ri-1,w=m.winner?(m.winner===1?m.p1:m.p2)+' 승':'결과 대기';let vc1=0,vc2=0;Object.values(m.picks||{}).forEach(v=>{if(v===1)vc1++;else if(v===2)vc2++;});return`<div class="hist ${i===data.current?'current':''}" onclick="data.current=${i};save()"><b>${i+1}경기 ${esc(m.p1)} ${raceBadge(m.race1||'')} vs ${esc(m.p2)} ${raceBadge(m.race2||'')}</b><div class="small">${esc(teamLabel(m.team1)||'-')} / ${esc(teamLabel(m.team2)||'-')} · ${vc1}:${vc2} · ${esc(w)}</div></div>`}).join('')||'<div class="small">아직 경기 기록이 없어.</div>'}
function pick(n,v){let m=current();if(!m||m.locked||m.winner)return;m.picks[decodeURIComponent(n)]=v;save()}
function toggleLock(){let m=current();if(m){m.locked=!m.locked;save()}}
function setWinner(v){
  let m=current();if(!m)return;
  const winner=v===1?m.p1:m.p2;
  if(!m.locked && !confirm('예측을 마감하고 결과 입력할까?')) return;
  if(!confirm(`${winner} 승리로 확정할까?\n순위가 다시 계산돼.`)) return;
  m.locked=true;m.winner=v;save();
}
function clearWinner(){let m=current();if(m){m.winner=null;save()}}
function duplicateMatch(){let m=current();if(!m)return;data.matches.push({p1:m.p1,p2:m.p2,race1:m.race1||'',race2:m.race2||'',team1:m.team1||'',team2:m.team2||'',picks:{},locked:false,winner:null});data.current=data.matches.length-1;save()}
function deleteCurrentMatch(){if(data.current<0||!confirm('현재 경기를 삭제할까?'))return;data.matches.splice(data.current,1);data.current=Math.min(data.current,data.matches.length-1);save()}
function resetTournament(){if(!confirm('경기/예측/순위를 초기화할까? 참가자와 선수 명단은 유지돼.'))return;data.matches=[];data.current=-1;save()}
function modal(h){document.getElementById('dialog').innerHTML=h;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}


function toggleMissingOnly(){
  missingOnly=!missingOnly;
  render();
}
function quickAddParticipant(){
  modal(`<h3>빠른 참가자 추가</h3>
    <div class="field"><label>참가자 이름</label><input id="quickParticipantName" placeholder="닉네임" autofocus></div>
    <div class="hint">추가 즉시 현재 경기부터 예측 가능해.</div>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn primary" onclick="saveQuickParticipant()">추가</button>
      <button class="btn" onclick="closeModal()">취소</button>
    </div>`);
}
function saveQuickParticipant(){
  const name=document.getElementById('quickParticipantName')?.value.trim();
  if(!name) return alert('이름을 입력해줘.');
  if(data.participants.includes(name)) return alert('이미 있는 참가자야.');
  data.participants.push(name);
  closeModal();
  save();
}

function openParticipants(){modal(`<h3>참가자 관리</h3><div class="field"><label>한 줄에 한 명씩</label><textarea id="plist">${esc(data.participants.join('\n'))}</textarea></div><div class="toolbar"><button class="btn primary" onclick="saveParticipants()">저장</button><button class="btn" onclick="closeModal()">취소</button></div>`)}
function saveParticipants(){data.participants=[...new Set(document.getElementById('plist').value.split(/\n/).map(x=>x.trim()).filter(Boolean))];closeModal();save()}

function openEventSettings(){modal(`<h3>대회 / 팀 설정</h3><div class="field"><label>대회명</label><input id="tname" value="${esc(data.tournament)}"></div><div class="grid2"><div class="field"><label>팀 A</label><input id="ta" value="${esc(data.teamA)}" placeholder="예: NEWCATSLE"></div><div class="field"><label>팀 B</label><input id="tb" value="${esc(data.teamB)}" placeholder="예: 상대팀"></div></div><div class="hint">팀명을 비우면 개인전처럼 사용할 수 있어.</div><div class="toolbar"><button class="btn primary" onclick="saveEventSettings()">저장</button><button class="btn" onclick="closeModal()">취소</button></div>`)}
function saveEventSettings(){data.tournament=document.getElementById('tname').value.trim()||'새 대회';data.teamA=document.getElementById('ta').value.trim();data.teamB=document.getElementById('tb').value.trim();closeModal();save()}



let scheduleDraft=[];

function openSchedule(){
  scheduleDraft=data.matches.map(m=>({
    p1:m.p1||'',
    p2:m.p2||'',
    race1:m.race1||'',
    race2:m.race2||'',
    picks:m.picks||{},
    locked:!!m.locked,
    winner:m.winner||null
  }));
  if(!scheduleDraft.length) scheduleDraft.push({p1:'',p2:'',race1:'',race2:'',picks:{},locked:false,winner:null});

  modal(`<h3>대진표 관리</h3>
    <div class="hint" style="margin-bottom:8px">
      ${data.teamA||data.teamB
        ? `<b>${esc(data.teamA||'팀 A')}</b> 선수와 <b>${esc(data.teamB||'팀 B')}</b> 선수 이름만 입력하면 돼.`
        : `왼쪽 선수와 오른쪽 선수 이름만 입력하면 돼.`}
    </div>
    <div class="schedule-head">
      <div>경기</div><div>${esc(data.teamA||'왼쪽 선수')}</div><div>종족</div><div>${esc(data.teamB||'오른쪽 선수')}</div><div>종족</div><div>관리</div>
    </div>
    <div id="scheduleEditor" class="schedule-editor"></div>
    <div class="toolbar" style="margin-top:10px">
      <button class="btn" onclick="addScheduleRow()">＋ 경기 추가</button>
      <button class="btn primary" onclick="saveSchedule()">대진표 저장</button>
      <button class="btn" onclick="closeModal()">취소</button>
    </div>`);
  renderScheduleEditor();
}

function renderScheduleEditor(){
  const box=document.getElementById('scheduleEditor');
  if(!box) return;
  box.innerHTML=scheduleDraft.map((r,i)=>`
    <div class="schedule-row">
      <div class="game-no">${i+1}</div>
      <input class="p1-input" value="${esc(r.p1)}" placeholder="${esc(data.teamA||'왼쪽 선수')}" oninput="scheduleDraft[${i}].p1=this.value">
      <select class="race-select race1-select" onchange="scheduleDraft[${i}].race1=this.value">${raceOptions(r.race1||'')}</select>
      <input class="p2-input" value="${esc(r.p2)}" placeholder="${esc(data.teamB||'오른쪽 선수')}" oninput="scheduleDraft[${i}].p2=this.value">
      <select class="race-select race2-select" onchange="scheduleDraft[${i}].race2=this.value">${raceOptions(r.race2||'')}</select>
      <div class="row-actions">
        <button class="mini" onclick="moveScheduleRow(${i},-1)" ${i===0?'disabled':''}>▲</button>
        <button class="mini" onclick="moveScheduleRow(${i},1)" ${i===scheduleDraft.length-1?'disabled':''}>▼</button>
        <button class="mini danger" onclick="deleteScheduleRow(${i})">삭제</button>
      </div>
    </div>`).join('');
}

function addScheduleRow(){
  scheduleDraft.push({p1:'',p2:'',race1:'',race2:'',picks:{},locked:false,winner:null});
  renderScheduleEditor();
  const box=document.getElementById('scheduleEditor');
  if(box) setTimeout(()=>box.lastElementChild?.querySelector('input')?.focus(),0);
}

function deleteScheduleRow(i){
  if(scheduleDraft.length===1){
    scheduleDraft[0]={p1:'',p2:'',race1:'',race2:'',picks:{},locked:false,winner:null};
  }else{
    scheduleDraft.splice(i,1);
  }
  renderScheduleEditor();
}

function moveScheduleRow(i,dir){
  const j=i+dir;
  if(j<0||j>=scheduleDraft.length) return;
  [scheduleDraft[i],scheduleDraft[j]]=[scheduleDraft[j],scheduleDraft[i]];
  renderScheduleEditor();
}

function saveSchedule(){
  const clean=scheduleDraft
    .map(r=>({...r,p1:(r.p1||'').trim(),p2:(r.p2||'').trim()}))
    .filter(r=>r.p1||r.p2);

  if(clean.some(r=>!r.p1||!r.p2)){
    alert('선수 이름이 한쪽만 입력된 경기가 있어. 두 선수 모두 입력해줘.');
    return;
  }

  data.matches=clean.map(r=>({
    p1:r.p1,p2:r.p2,
    race1:r.race1||'',race2:r.race2||'',
    team1:data.teamA?'A':'',
    team2:data.teamB?'B':'',
    picks:r.picks||{},
    locked:!!r.locked,
    winner:r.winner||null
  }));

  if(!data.matches.length) data.current=-1;
  else if(data.current<0) data.current=0;
  else data.current=Math.min(data.current,data.matches.length-1);

  closeModal();
  save();
}

function openNewMatch(){
  modal(`<h3>경기 추가</h3>
    <div class="grid2">
      <div>
        <div class="field"><label>왼쪽 선수</label><input id="np1" placeholder="선수명"></div>
        <div class="field"><label>종족</label><select id="nr1">${raceOptions('')}</select></div>
      </div>
      <div>
        <div class="field"><label>오른쪽 선수</label><input id="np2" placeholder="선수명"></div>
        <div class="field"><label>종족</label><select id="nr2">${raceOptions('')}</select></div>
      </div>
    </div>
    <div class="hint">팀전이면 왼쪽=팀 A, 오른쪽=팀 B로 자동 적용돼.</div>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn primary" onclick="addMatch()">추가</button>
      <button class="btn" onclick="closeModal()">취소</button>
    </div>`);
}

function addMatch(){
  const a=document.getElementById('np1').value.trim();
  const b=document.getElementById('np2').value.trim();
  if(!a||!b) return alert('두 선수 이름을 입력해줘.');

  data.matches.push({
    p1:a,
    p2:b,
    team1:data.teamA?'A':'',
    team2:data.teamB?'B':'',
    picks:{},
    locked:false,
    winner:null
  });

  if(data.current<0) data.current=0;
  closeModal();
  save();
}

function nextMatch(){
  if(!data.matches.length) return;
  if(data.current<data.matches.length-1){
    data.current++;
    save();
  }else{
    alert('마지막 경기야.');
  }
}

function prevMatch(){
  if(data.current>0){
    data.current--;
    save();
  }
}

function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='승자예측_'+data.tournament+'.json';a.click()}
function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.participants)||!Array.isArray(x.matches))throw 0;data=x;save()}catch(_){alert('올바른 백업 파일이 아니야.')}};r.readAsText(f)}


const VIEW_MODE_KEY='majhyeodorang_view_mode';
function applyViewMode(){
  const desktop=localStorage.getItem(VIEW_MODE_KEY)==='desktop';
  document.body.classList.toggle('force-desktop',desktop);
  const b=document.getElementById('viewToggle');
  if(b) b.textContent=desktop?'📱 모바일 화면':'🖥 PC 화면';
}
function toggleDesktopMode(){
  const desktop=!document.body.classList.contains('force-desktop');
  localStorage.setItem(VIEW_MODE_KEY,desktop?'desktop':'mobile');
  applyViewMode();
  window.scrollTo(0,0);
}
window.addEventListener('DOMContentLoaded',applyViewMode);

const APP_VERSION='5.2.0';
let __updateBusy=false;

async function checkForUpdate(force=false){
  if(__updateBusy) return;
  __updateBusy=true;
  try{
    const res=await fetch('./version.json?t='+Date.now(),{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache'}
    });
    if(!res.ok) throw new Error('version check failed');
    const info=await res.json();
    const latest=String(info.version||'');
    if(latest && latest!==APP_VERSION){
      // localStorage는 건드리지 않고 주소만 새 버전 쿼리로 교체
      const u=new URL(location.href);
      u.searchParams.set('v',latest);
      u.searchParams.set('_',Date.now().toString());
      location.replace(u.toString());
      return;
    }
    if(force) alert('현재 최신 버전이야. v'+APP_VERSION);
  }catch(e){
    // 오프라인/일시적 네트워크 오류는 앱 사용을 막지 않음
    console.warn('업데이트 확인 실패',e);
  }finally{
    __updateBusy=false;
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js?v=5.2.0',{updateViaCache:'none'});
      reg.update().catch(()=>{});
    }catch(e){ console.warn('SW 등록 실패',e); }
    checkForUpdate(false);
  });
}

window.addEventListener('focus',()=>checkForUpdate(false));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') checkForUpdate(false);
});
setInterval(()=>checkForUpdate(false),60000);


document.addEventListener('keydown',e=>{
  const tag=(e.target?.tagName||'').toLowerCase();
  if(['input','textarea','select'].includes(tag)) return;
  if(e.key==='ArrowRight'){e.preventDefault();nextMatch();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prevMatch();}
  else if(e.code==='Space'){e.preventDefault();toggleLock();}
  else if(e.key==='1'){e.preventDefault();const m=current();if(m&&m.locked)setWinner(1);}
  else if(e.key==='2'){e.preventDefault();const m=current();if(m&&m.locked)setWinner(2);}
});

render();
</script>
</body></html>
