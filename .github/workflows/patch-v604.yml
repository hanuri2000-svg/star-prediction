name: Apply v6.0.4 branding layout
on:
  push:
    paths:
      - '.github/workflows/patch-v604.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply branding layout
        run: |
          sed -i 's/6\.0\.3/6.0.4/g' index.html
          if ! grep -q 'v6.0.4 캐릭터 + HARINA 로고' pastel-theme.css; then
            cat >> pastel-theme.css <<'CSS'

          /* ===== v6.0.4 캐릭터 + HARINA 로고 ===== */
          header{
            position:sticky !important;
            padding-top:88px !important;
            overflow:visible !important;
          }
          header::before{
            content:'';
            position:absolute;
            left:50%;
            top:4px;
            transform:translateX(-50%);
            width:270px;
            height:82px;
            background:url('./assets/harina-logo.webp?v=604') center/contain no-repeat;
            filter:drop-shadow(0 8px 12px rgba(160,119,210,.12));
            pointer-events:none;
            z-index:2;
          }
          .brand{
            min-width:330px !important;
            min-height:72px !important;
            padding-left:92px !important;
            overflow:visible !important;
          }
          .brand::before{
            content:'';
            position:absolute;
            left:8px;
            bottom:-2px;
            width:78px;
            height:80px;
            background:url('./assets/matchedorang-character.webp?v=604') center bottom/contain no-repeat;
            filter:drop-shadow(0 7px 10px rgba(184,151,219,.13));
            pointer-events:none;
            z-index:1;
          }
          .brand h1,.brand .subtitle{position:relative;z-index:2}

          @media(max-width:900px){
            body:not(.force-desktop) header{padding-top:67px !important}
            body:not(.force-desktop) header::before{width:205px;height:62px;top:2px}
            body:not(.force-desktop) .brand{min-width:0 !important;min-height:66px !important;padding-left:76px !important}
            body:not(.force-desktop) .brand::before{left:6px;width:64px;height:66px}
          }
          CSS
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pastel-theme.css
          git commit -m 'Place character and HARINA logo for v6.0.4' || exit 0
          git push
