name: Remove EloBoard auto race integration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-v56.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove EloBoard sync and keep manual race selection
        shell: python
        run: |
          from pathlib import Path
          import json, re

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          # Remove v5.6 player DB-only CSS.
          html=re.sub(
              r'\n/\* ===== v5\.6 EloBoard player DB ===== \*/\n.*?input\[list\]\{padding-right:26px\}\n',
              '\n', html, count=1, flags=re.S
          )

          # Remove EloBoard player DB JavaScript block.
          html=re.sub(
              r'\nlet eloPlayers=\[\];.*?\nlet scheduleDraft=\[\];',
              '\nlet scheduleDraft=[];', html, count=1, flags=re.S
          )

          # Remove DB status/datalist from schedule dialog.
          html=html.replace('    ${eloDbNote()}\n    ${eloDatalist()}\n','')

          # Restore plain schedule name inputs; keep manual race selectors.
          html=html.replace(
              '<input class="p1-input" list="eloPlayersList" value="${esc(r.p1)}" placeholder="${esc(data.teamA||\'왼쪽 선수\')}" oninput="scheduleNameInput(${i},1,this)">',
              '<input class="p1-input" value="${esc(r.p1)}" placeholder="${esc(data.teamA||\'왼쪽 선수\')}" oninput="scheduleDraft[${i}].p1=this.value">'
          )
          html=html.replace(
              '<input class="p2-input" list="eloPlayersList" value="${esc(r.p2)}" placeholder="${esc(data.teamB||\'오른쪽 선수\')}" oninput="scheduleNameInput(${i},2,this)">',
              '<input class="p2-input" value="${esc(r.p2)}" placeholder="${esc(data.teamB||\'오른쪽 선수\')}" oninput="scheduleDraft[${i}].p2=this.value">'
          )

          # Restore plain new-match inputs and remove DB note.
          html=html.replace(
              '<input id="np1" list="eloPlayersList" placeholder="선수명" oninput="autoRaceFor(\'np1\',\'nr1\')">',
              '<input id="np1" placeholder="선수명">'
          )
          html=html.replace(
              '<input id="np2" list="eloPlayersList" placeholder="선수명" oninput="autoRaceFor(\'np2\',\'nr2\')">',
              '<input id="np2" placeholder="선수명">'
          )
          html=html.replace('    ${eloDatalist()}\n    ${eloDbNote()}\n','')
          html=html.replace(
              '    <div class="hint">팀전이면 왼쪽=팀 A, 오른쪽=팀 B로 자동 적용돼. DB에 없는 선수는 종족을 직접 선택하면 돼.</div>',
              '    <div class="hint">팀전이면 왼쪽=팀 A, 오른쪽=팀 B로 자동 적용돼. 종족은 직접 선택하면 돼.</div>'
          )

          # Race is now always taken only from the manual selectors.
          html=html.replace(
              "  const race1=document.getElementById('nr1')?.value||eloRace(a)||'';\n  const race2=document.getElementById('nr2')?.value||eloRace(b)||'';",
              "  const race1=document.getElementById('nr1')?.value||'';\n  const race2=document.getElementById('nr2')?.value||'';"
          )

          # Stop loading player DB at startup.
          html=html.replace(
              "window.addEventListener('DOMContentLoaded',()=>{applyViewMode();loadEloPlayers();});",
              "window.addEventListener('DOMContentLoaded',applyViewMode);"
          )

          # Version bump.
          html=html.replace('v5.6</span>','v5.7</span>')
          html=html.replace("const APP_VERSION='5.6.0';","const APP_VERSION='5.7.0';")
          html=html.replace('sw.js?v=5.6.0','sw.js?v=5.7.0')

          # Safety check: no EloBoard auto-race runtime references should remain.
          banned=['eloPlayersList','eloDbNote','eloRace(','loadEloPlayers','scheduleNameInput','autoRaceFor']
          remain=[x for x in banned if x in html]
          if remain:
              raise SystemExit('EloBoard references remain: '+', '.join(remain))

          p.write_text(html,encoding='utf-8')

          Path('version.json').write_text(json.dumps({
              'version':'5.7.0',
              'updated':'2026-08-25',
              'notes':'EloBoard 자동 종족 지정 제거 · 경기 추가/대진표 종족 수동 선택 유지'
          },ensure_ascii=False,indent=2),encoding='utf-8')

          Path('sw.js').write_text("""const SW_VERSION='5.7.0';
          self.addEventListener('install',e=>self.skipWaiting());
          self.addEventListener('activate',e=>e.waitUntil((async()=>{const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));await self.clients.claim()})()));
          self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET')return;const u=new URL(r.url);if(u.origin!==location.origin)return;e.respondWith((async()=>{try{return await fetch(r,{cache:'no-store'})}catch(x){return fetch(r)}})())});
          """,encoding='utf-8')

          # Delete unused sync assets.
          for f in [
              Path('players.json'),
              Path('scripts/sync_eloboard_players.py'),
              Path('.github/workflows/sync-eloboard-players.yml')
          ]:
              if f.exists(): f.unlink()

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove EloBoard auto race integration and release v5.7"
          git push
