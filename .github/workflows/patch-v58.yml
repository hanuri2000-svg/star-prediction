name: Harden v5.8 player race memory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-v58.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prevent stale remembered race values
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          old="""function autoRememberedRace(inputId,selectId){
  const input=document.getElementById(inputId),select=document.getElementById(selectId);if(!input||!select)return;
  const r=rememberedRace(input.value);if(r)select.value=r;
}
function schedulePlayerInput(i,side,el){
  const key=side===1?'p1':'p2',raceKey=side===1?'race1':'race2';
  scheduleDraft[i][key]=el.value;
  const r=rememberedRace(el.value);
  if(r){scheduleDraft[i][raceKey]=r;const sel=el.closest('.schedule-row')?.querySelector(side===1?'.race1-select':'.race2-select');if(sel)sel.value=r}
}
"""
          new="""function autoRememberedRace(inputId,selectId){
  const input=document.getElementById(inputId),select=document.getElementById(selectId);if(!input||!select)return;
  select.value=rememberedRace(input.value)||'';
}
function schedulePlayerInput(i,side,el){
  const key=side===1?'p1':'p2',raceKey=side===1?'race1':'race2';
  scheduleDraft[i][key]=el.value;
  const r=rememberedRace(el.value)||'';
  scheduleDraft[i][raceKey]=r;
  const sel=el.closest('.schedule-row')?.querySelector(side===1?'.race1-select':'.race2-select');
  if(sel)sel.value=r;
}
"""
          if old not in html:
              raise SystemExit('autofill function pattern not found')
          p.write_text(html.replace(old,new,1),encoding='utf-8')

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harden v5.8 player race autofill"
          git push
