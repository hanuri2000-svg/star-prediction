name: Apply v6.0 pastel theme
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-v60.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply theme and version
        shell: python
        run: |
          from pathlib import Path
          import json

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          if 'pastel-theme.css' not in html:
              html=html.replace('<link rel="manifest" href="./manifest.webmanifest">','<link rel="manifest" href="./manifest.webmanifest">\n<link rel="stylesheet" href="./pastel-theme.css?v=6.0.0">',1)
          html=html.replace('v5.9</span>','v6.0</span>',1)
          html=html.replace("const APP_VERSION='5.9.0';","const APP_VERSION='6.0.0';",1)
          html=html.replace('sw.js?v=5.9.0','sw.js?v=6.0.0',1)
          p.write_text(html,encoding='utf-8')

          Path('version.json').write_text(json.dumps({
            'version':'6.0.0',
            'updated':'2026-08-26',
            'notes':'화이트 파스텔 카드형 테마 적용 · 고양이 발바닥 포인트 · 종족색 유지'
          },ensure_ascii=False,indent=2),encoding='utf-8')

          Path('sw.js').write_text("""const SW_VERSION='6.0.0';
          self.addEventListener('install',e=>self.skipWaiting());
          self.addEventListener('activate',e=>e.waitUntil((async()=>{const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));await self.clients.claim()})()));
          self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET')return;const u=new URL(r.url);if(u.origin!==location.origin)return;e.respondWith((async()=>{try{return await fetch(r,{cache:'no-store'})}catch(x){return fetch(r)}})())});
          """,encoding='utf-8')
      - name: Commit v6.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json sw.js pastel-theme.css
          git commit -m "Apply white pastel cat card theme v6.0" || exit 0
          git push
