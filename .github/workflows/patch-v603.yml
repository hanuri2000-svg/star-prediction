name: Apply v6.0.3 header cleanup
on:
  push:
    paths:
      - '.github/workflows/patch-v603.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch theme and version
        shell: python
        run: |
          from pathlib import Path
          import json, re

          css_path=Path('pastel-theme.css')
          css=css_path.read_text(encoding='utf-8')
          marker='/* ===== v6.0.3 상단 헤더 양끝 띠 제거 ===== */'
          block=r'''

          /* ===== v6.0.3 상단 헤더 양끝 띠 제거 ===== */
          header{
            background:transparent !important;
            border-bottom:0 !important;
            box-shadow:none !important;
            backdrop-filter:none !important;
          }
          body:not(.force-desktop) header{
            background:transparent !important;
            border-bottom:0 !important;
          }
          .wrap{background:transparent !important;}
          '''
          if marker not in css:
              css += block
          css_path.write_text(css,encoding='utf-8')

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html=html.replace('pastel-theme.css?v=6.0.2','pastel-theme.css?v=6.0.3')
          html=html.replace('v6.0.2</span>','v6.0.3</span>')
          html=html.replace("const APP_VERSION='6.0.2';","const APP_VERSION='6.0.3';")
          html=html.replace('sw.js?v=6.0.2','sw.js?v=6.0.3')
          p.write_text(html,encoding='utf-8')

          Path('version.json').write_text(json.dumps({
            'version':'6.0.3',
            'updated':'2026-08-26',
            'notes':'상단 헤더 양끝 배경 띠 제거 · 브랜드와 버튼만 파스텔 배경 위에 자연스럽게 표시'
          },ensure_ascii=False,indent=2),encoding='utf-8')

          sw=Path('sw.js').read_text(encoding='utf-8')
          sw=re.sub(r"const SW_VERSION='[^']+';","const SW_VERSION='6.0.3';",sw, count=1)
          Path('sw.js').write_text(sw,encoding='utf-8')
      - name: Commit v6.0.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pastel-theme.css version.json sw.js
          git commit -m "Clean header edges and release v6.0.3" || exit 0
          git push
