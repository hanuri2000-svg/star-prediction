name: Apply v6.0.2 background finish
on:
  push:
    paths:
      - '.github/workflows/patch-v602.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Smooth page bottom background
        shell: python
        run: |
          from pathlib import Path
          import json

          css=Path('pastel-theme.css')
          s=css.read_text(encoding='utf-8')
          patch='''\n\n/* ===== v6.0.2 하단 배경 자연스러운 마무리 ===== */\nhtml{\n  min-height:100% !important;\n  background:#fff9fc !important;\n}\nbody{\n  min-height:100vh !important;\n  background:\n    radial-gradient(circle at 4% 0%,rgba(255,221,238,.70) 0,transparent 25%),\n    radial-gradient(circle at 96% 3%,rgba(222,240,255,.80) 0,transparent 24%),\n    radial-gradient(ellipse at 50% 115%,rgba(242,226,255,.52) 0,transparent 48%),\n    linear-gradient(180deg,#fffafd 0%,#fafbff 62%,#fff8fc 100%) !important;\n  background-attachment:fixed !important;\n}\n.credit{\n  background:transparent !important;\n  padding:18px 0 30px !important;\n  margin:0 !important;\n}\n'''
          if 'v6.0.2 하단 배경 자연스러운 마무리' not in s:
              s=s.rstrip()+patch+'\n'
          css.write_text(s,encoding='utf-8')

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html=html.replace('pastel-theme.css?v=6.0.1','pastel-theme.css?v=6.0.2')
          html=html.replace('v6.0.1</span>','v6.0.2</span>')
          html=html.replace("const APP_VERSION='6.0.1';","const APP_VERSION='6.0.2';")
          html=html.replace('sw.js?v=6.0.1','sw.js?v=6.0.2')
          p.write_text(html,encoding='utf-8')

          Path('version.json').write_text(json.dumps({
            'version':'6.0.2',
            'updated':'2026-08-26',
            'notes':'하단 배경 끊김 수정 · 파스텔 그라데이션을 화면 끝까지 자연스럽게 연결'
          },ensure_ascii=False,indent=2),encoding='utf-8')

          sw=Path('sw.js')
          sws=sw.read_text(encoding='utf-8').replace("const SW_VERSION='6.0.1';","const SW_VERSION='6.0.2';")
          sw.write_text(sws,encoding='utf-8')
      - name: Commit v6.0.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pastel-theme.css index.html version.json sw.js
          git commit -m "Smooth bottom background and release v6.0.2"
          git push
