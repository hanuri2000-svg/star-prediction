name: Sync EloBoard players

on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *'
  push:
    paths:
      - '.github/workflows/sync-eloboard-players.yml'
      - 'scripts/sync_eloboard_players.py'

permissions:
  contents: write

concurrency:
  group: sync-eloboard-players
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect player names and races
        run: python scripts/sync_eloboard_players.py

      - name: Update players.json through GitHub Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: main
        shell: python
        run: |
          import base64
          import json
          import os
          from pathlib import Path
          import requests

          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}/contents/players.json'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          current = requests.get(api, headers=headers, params={'ref': branch}, timeout=20)
          current.raise_for_status()
          sha = current.json()['sha']
          raw = Path('players.json').read_bytes()
          body = {
              'message': 'Sync EloBoard player database',
              'content': base64.b64encode(raw).decode('ascii'),
              'sha': sha,
              'branch': branch,
          }
          updated = requests.put(api, headers=headers, json=body, timeout=30)
          updated.raise_for_status()
          print('players.json updated:', updated.json()['commit']['sha'])
